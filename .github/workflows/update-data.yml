name: Update Traffic Data

on:
  workflow_dispatch:  # 手動実行のみ

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # ビューワー自動ビルド＆プッシュに必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get today's date (for cache key)
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      # 前日のキャッシュを復元 → 既存CSVはダウンロードをスキップ
      - name: Restore CSV cache
        uses: actions/cache@v4
        with:
          path: data/
          key: jartic-csv-${{ steps.date.outputs.date }}
          restore-keys: |
            jartic-csv-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Download new CSV data
        run: python scripts/download_jartic.py

      # 既存の蓄積データをS3から取得してマージに備える
      - name: Download existing 1h accumulated data from S3
        run: |
          mkdir -p docs
          aws s3 cp s3://pmtiles-data/mlit/traffic-data/data_1h_all.json.gz docs/data_1h_all.json.gz || true

      - name: Process CSV to JSON
        run: python scripts/process_csv.py

      # 差分のみアップロード（新しい日付ファイルだけ）
      - name: Sync data_5m to S3
        run: |
          aws s3 sync docs/data_5m/ s3://pmtiles-data/mlit/traffic-data/data_5m/ \
            --size-only
          # index.json は毎回上書き（--size-only だとスキップされる場合があるため）
          aws s3 cp docs/data_5m/index.json \
            s3://pmtiles-data/mlit/traffic-data/data_5m/index.json

      # 全期間統合ファイルは毎回更新
      - name: Upload data_1h_all to S3
        run: |
          aws s3 cp docs/data_1h_all.json.gz \
            s3://pmtiles-data/mlit/traffic-data/data_1h_all.json.gz

      # ビューワーを自動ビルドして GitHub Pages へプッシュ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json

      - name: Build viewer
        run: |
          cd viewer
          npm ci
          npm run build

      - name: Commit and push viewer build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Auto-update viewer build [skip ci]"
          git push
