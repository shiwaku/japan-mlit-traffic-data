name: Update Traffic Data

on:
  workflow_dispatch:  # 手動実行
  schedule:
    - cron: '0 19 * * 0'  # 毎週月曜 4:00 JST（日曜 19:00 UTC）に自動実行

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # gh-pagesブランチへのpushに必要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get today's date (for cache key)
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      # 前回実行分のキャッシュを復元 → 既存CSVはダウンロードをスキップ
      - name: Restore CSV cache
        uses: actions/cache@v4
        with:
          path: data/
          key: jartic-csv-${{ steps.date.outputs.date }}
          restore-keys: |
            jartic-csv-

      - name: Download new CSV data
        run: python scripts/download_jartic.py

      # API提供期間（5分間=直近1ヶ月、1時間=直近3ヶ月）のみを出力。過去データの蓄積はしない
      - name: Process CSV to JSON
        run: python scripts/process_csv.py

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Build stations.pmtiles
        run: |
          tippecanoe \
            -o docs/stations.pmtiles \
            --name=jartic-stations \
            --layer=stations \
            -z14 -Z5 \
            -r1 \
            --force \
            docs/stations.geojson

      - name: Build viewer
        working-directory: viewer
        run: |
          npm ci
          npm run build

      # docs/ 一式を gh-pages ブランチに orphan commit で全差し替え
      # （履歴を残さないことでリポジトリサイズを一定に保つ）
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
          force_orphan: true
